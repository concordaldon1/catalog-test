<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111917;--surface:#192320;--elevated:#222e2a;--ink:#e2e8e4;--mute:#9bafa9;--line:#2d3b37;--accent:#56b7ae;--accent-soft:#203632;--bad:#f28b8b;--focus:#8ad8d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px}
.header-inner{max-width:1280px;margin:0 auto}
.brand-banner{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--accent-soft)}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:7px;background:#0d625c;color:#fff;font-size:12px;font-weight:700}
.brand-name{font-size:14px;font-weight:600;letter-spacing:.04em}
.heading-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.asof{flex:none;margin:0;color:var(--mute);font-size:12px;line-height:1.3;font-weight:400}
.asof.warn{color:var(--bad)}
.filters{display:grid;gap:8px;margin-top:10px}
.filter-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#typ[hidden]+#sty{grid-column:auto}
input,select,button{min-height:44px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--elevated);color:var(--ink);transition:border-color .14s ease,background-color .14s ease}
input[type=search]{width:100%;min-width:0}
input::placeholder{color:var(--mute);opacity:.85}
select{min-width:0;cursor:pointer}
input:hover,select:hover{border-color:#49635c}
button{cursor:pointer;background:var(--accent);color:#10201d;border-color:var(--accent);font-weight:600}
button:hover{background:#70c9c0;border-color:#70c9c0}
button:active{background:#3f9991;transform:translateY(1px)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.summary-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:8px}
.sum{margin:0;color:var(--mute);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
.sort-control{width:190px}
main{max-width:1280px;margin:0 auto;padding:16px 16px 32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.grp{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0;overflow:hidden;transition:border-color .14s ease,background-color .14s ease}
.grp:hover{border-color:#40554e;background:#1b2622}
.top{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:16px}
.ph{width:min(100%,220px);height:220px;flex:none;align-self:center;border-radius:9px;background:#141d1a;object-fit:cover;object-position:center;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center;padding:0}
.item-info{min-width:0}
.top h2{margin:0;font-size:18px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.style-number{margin-top:4px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.item-color{margin-top:6px;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.item-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.meta{color:var(--mute);font-size:14px}
.tot{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px;min-width:0;text-align:right;white-space:nowrap}
.tot .meta:first-child{grid-column:1/-1;text-align:left}
.tot b{grid-column:1/-1;text-align:left}
.tot b{display:block;font-size:24px;line-height:1.2;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.type-badge{display:inline-flex;align-items:center;min-height:26px;padding:3px 9px;border:1px solid #36534c;border-radius:6px;background:var(--accent-soft);color:#a8d8d1;font-size:13px;font-weight:500}
details{border-top:1px solid var(--line);margin-top:auto}
summary{padding:12px 18px;cursor:pointer;color:var(--accent);font-weight:500;transition:background-color .14s ease}
summary:hover{background:rgba(86,183,174,.07)}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 16px;text-align:left;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mute);font-weight:500}
td:last-child,th:last-child{text-align:right}
.msg{grid-column:1/-1;padding:24px 16px;text-align:center;color:var(--mute)}
.err{color:var(--bad)}
img.ph{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:20;background:rgba(8,13,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;cursor:zoom-out}
#lb[hidden]{display:none}
#lbimg{max-width:96vw;max-height:84vh;object-fit:contain;border:1px solid var(--line);border-radius:8px}
#lbcap{color:var(--ink);font-size:14px;text-align:center}
#lbx{position:absolute;top:10px;right:12px;font-size:22px;line-height:1;padding:8px 12px;background:var(--elevated);border-color:var(--line);color:var(--ink)}
@media(min-width:900px){main{padding-top:18px}}
@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){header{padding:11px 12px}.brand-banner{margin-bottom:10px}.heading-row{align-items:center}h1{font-size:20px}.asof{max-width:52%;text-align:right}main{padding:12px 10px 24px}.grp{display:block}.top{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(82px,auto);gap:10px;padding:14px}.ph{width:92px;height:92px}.tot{display:block;min-width:82px;text-align:right}.tot .meta:first-child,.tot b{display:block;text-align:right}.tot b{font-size:20px}.sort-control{width:150px;font-size:13px;padding-left:9px;padding-right:22px}.filter-row{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-row select{font-size:14px;padding-left:8px;padding-right:22px}#wdt{grid-column:1/-1}.sum{font-size:12px}summary{padding:11px 12px}td,th{padding:9px 12px}}
@media(max-width:360px){.top{grid-template-columns:80px minmax(0,1fr) minmax(74px,auto);gap:8px;padding:12px}.ph{width:80px;height:80px}.tot{min-width:74px}.tot b{font-size:18px}.sort-control{width:138px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand-banner" aria-label="Carpetmarts America"><span class="brand-mark" aria-hidden="true">CM</span><span class="brand-name">CARPETMARTS AMERICA</span></div>
    <div class="heading-row">
      <h1>Roll Inventory</h1>
      <p class="asof" id="asof">Inventory as of: loading…</p>
    </div>
    <div class="filters">
    <input id="q" type="search" placeholder="Search style or color" aria-label="Search">
    <div class="filter-row">
    <select id="typ" aria-label="Filter by type" hidden><option value="">All product types</option></select>
    <select id="sty" aria-label="Filter by style"><option value="">All styles</option></select>
    <select id="wdt" aria-label="Filter by product width"><option value="">All widths</option></select>
    </div>
    </div>
    <div class="summary-row">
      <p class="sum" id="sum"></p>
    <select id="sort" class="sort-control" aria-label="Sort"><option value="name">Sort: Style / Color</option><option value="most">Sort: Most in stock</option></select>
    </div>
  </div>
</header>
<main id="out"><p class="msg">Loading inventory…</p></main>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Enlarged photo">
  <button id="lbx" aria-label="Close">&times;</button>
  <img id="lbimg" alt="">
  <div id="lbcap"></div>
</div>

<script>
// Settings: change these if your file or folder names differ.
var CSV_FILE = 'inventory.csv', PHOTO_DIR = 'photos/', PHOTO_MANIFEST = 'photos/manifest.json', PHOTO_EXT = ['jpg','jpeg','png','webp'];
var PAGE_SIZE = 20;   // style/color entries shown at a time
var rows = [], listedRows = [], shown = PAGE_SIZE;
var photoFiles = new Set(), searchTimer = null, photoManifestFailed = false;
var photoObserver = 'IntersectionObserver' in window ? new IntersectionObserver(function(entries){
  entries.forEach(function(entry){ if (entry.isIntersecting){ photoObserver.unobserve(entry.target); loadPhoto(entry.target); } });
}, {rootMargin:'250px 0px'}) : null;

function parse(text){
  text = text.replace(/^\uFEFF/, '');
  var first = text.split(/\r?\n/)[0];
  var d = (first.match(/\t/g)||[]).length >= (first.match(/,/g)||[]).length ? '\t' : ',';
  var out = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){cur += '"'; i++;} else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); out.push(row); }
  return out;
}

function load(text){
  var t = parse(text), seen = {}, data = [];
  var head = null;
  t.forEach(function(r){
    var low = r.map(function(x){return x.trim().toLowerCase();});
    if (low.indexOf('roll number') > -1){ head = low; return; }   // handles repeated header rows
    if (!head || r.join('').trim() === '') return;
    function g(n){ var i = head.indexOf(n); return i > -1 ? (r[i]||'').trim() : ''; }
    var avail = parseFloat(g('amt avail').replace(/,/g,'')), type = g('type');
    if (!(avail > 0)) return;
    var roll = g('roll number');
    if (type !== 'Carpet Tile' && !roll) return;
    if (type !== 'Carpet Tile') { if (seen[roll]) return; seen[roll] = 1; }
    data.push({roll:roll, style:g('style'), sn:g('style number'), color:g('color'), cn:g('color number'), width:g('width'), type:type, avail:avail});
  });
  rows = data;
  var typSel = document.getElementById('typ'), types = {};
  var hasPhotoByItem = {};
  data.forEach(function(r){ if (photoCandidates(r).length) hasPhotoByItem[photoKey(r)] = true; });
  var listedData = data.filter(function(r){ return hasPhotoByItem[photoKey(r)]; });
  listedRows = listedData;
  listedData.forEach(function(r){ if (r.type) types[r.type] = 1; });
  var typeList = Object.keys(types).sort();
  typSel.innerHTML = '<option value="">All product types</option>' + typeList.map(function(t){ return '<option>' + esc(t) + '</option>'; }).join('');
  typSel.hidden = typeList.length < 2;   // only show the filter when the CSV has more than one type
  refreshDependentFilters(true);
  render();
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(n){ return n.toLocaleString(undefined,{maximumFractionDigits:2}); }
function unitForType(type){ return type === 'Carpet Tile' ? 'yds' : 'ft'; }
function colorLabel(r){ return r.color && r.cn && r.color !== r.cn ? r.color + ' (' + r.cn + ')' : (r.color || r.cn); }
function styleLabel(r){ return r.style + (r.sn && r.sn !== r.style ? ' (' + r.sn + ')' : ''); }
function naturalCompare(a,b){ return String(a || '').localeCompare(String(b || ''), undefined, {numeric:true, sensitivity:'base'}); }
function distinctSorted(values){
  var found = {};
  values.forEach(function(value){ value = String(value || '').trim(); if (value) found[value] = 1; });
  return Object.keys(found).sort(naturalCompare);
}
function refreshDependentFilters(reset){
  var typeSel = document.getElementById('typ'), styleSel = document.getElementById('sty'), widthSel = document.getElementById('wdt');
  if (reset){ styleSel.value = ''; widthSel.value = ''; }
  var type = typeSel.value, style = styleSel.value, width = widthSel.value;
  function stylesFor(selectedType, selectedWidth){
    return distinctSorted(listedRows.filter(function(r){
      return (!selectedType || r.type === selectedType) && (!selectedWidth || String(r.width || '').trim() === selectedWidth);
    }).map(styleLabel));
  }
  function widthsFor(selectedType, selectedStyle){
    return distinctSorted(listedRows.filter(function(r){
      return (!selectedType || r.type === selectedType) && (!selectedStyle || styleLabel(r) === selectedStyle);
    }).map(function(r){ return r.width; }));
  }
  if (style && stylesFor(type, width).indexOf(style) < 0) style = '';
  if (width && widthsFor(type, style).indexOf(width) < 0) width = '';
  var styles = stylesFor(type, width), widths = widthsFor(type, style);
  styleSel.innerHTML = '<option value="">All styles</option>' + styles.map(function(value){ return '<option value="' + esc(value) + '">' + esc(value) + '</option>'; }).join('');
  widthSel.innerHTML = '<option value="">All widths</option>' + widths.map(function(value){ return '<option value="' + esc(value) + '">' + esc(value) + '′</option>'; }).join('');
  styleSel.value = style;
  widthSel.value = width;
  widthSel.disabled = widths.length === 0;
}
function compareStyleColor(a,b){
  var result = naturalCompare(styleLabel(a.r), styleLabel(b.r));
  if (result) return result;
  result = naturalCompare(colorLabel(a.r), colorLabel(b.r));
  if (result) return result;
  return naturalCompare(a.r.width, b.r.width);
}
function photoKey(r){ return [r.sn || r.style, r.cn || r.color].join('|'); }
function photoCandidates(r){
  var names = [];
  [r.sn, r.style].forEach(function(prefix){
    if (!prefix) return;
    [r.cn, r.color].forEach(function(value){
      if (value) ['_', '-', ' '].forEach(function(separator){ names.push(prefix + separator + value); });
    });
    names.push(prefix);
  });
  var tries = [], seen = {};
  names.forEach(function(name){
    PHOTO_EXT.forEach(function(ext){
      var file = name + '.' + ext;
      if (photoFiles.has(file) && !seen[file]){ seen[file] = true; tries.push(file); }
    });
  });
  return tries;
}

function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var typ = document.getElementById('typ').value, sty = document.getElementById('sty').value, width = document.getElementById('wdt').value, sort = document.getElementById('sort').value;
  var groups = {};
  rows.forEach(function(r){
    if (typ && r.type !== typ) return;
    if (sty && styleLabel(r) !== sty) return;
    if (width && String(r.width || '').trim() !== width) return;
    var hay = (styleLabel(r) + ' ' + colorLabel(r)).toLowerCase();
    if (q && !q.split(/\s+/).every(function(t){ return hay.indexOf(t) > -1; })) return;
    var k = [r.type, r.sn || r.style, r.cn || r.color, r.width].join('|');
    (groups[k] = groups[k] || {r:r, rolls:[], total:0});
    groups[k].rolls.push(r); groups[k].total += r.avail;
  });
  var list = Object.keys(groups).map(function(k){return groups[k];});
  list = list.map(function(group){
    var photoRow = group.rolls.find(function(roll){ return photoCandidates(roll).length > 0; });
    if (!photoRow) return null;
    group.r = photoRow;
    return group;
  }).filter(Boolean);
  list.sort(function(a,b){
    if (sort === 'most' && b.total !== a.total) return b.total - a.total;
    return compareStyleColor(a,b);
  });
  var totals = {};
  list.forEach(function(g){
    var type = g.r.type || 'Carpet';
    totals[type] = totals[type] || {amount:0, rolls:0};
    totals[type].amount += g.total;
    if (type !== 'Carpet Tile') totals[type].rolls += g.rolls.length;
  });
  var summary = Object.keys(totals).sort(naturalCompare).map(function(type){
    var total = type + ': ' + fmt(totals[type].amount) + ' ' + unitForType(type);
    if (type !== 'Carpet Tile') total += ' (' + totals[type].rolls + (totals[type].rolls === 1 ? ' roll)' : ' rolls)');
    return total;
  });
  document.getElementById('sum').textContent = summary.length ? 'Total: ' + summary.join(' · ') : '';
  var out = document.getElementById('out');
  if (!list.length){ out.innerHTML = '<p class="msg">No listed styles or colors with photos match your search.</p>'; return; }
  out.innerHTML = list.slice(0, shown).map(function(g, i){
    var r = g.r, isTile = r.type === 'Carpet Tile', rollCount = g.rolls.length;
    g.rolls.sort(function(a,b){return b.avail - a.avail;});
    return '<section class="grp"><div class="top">' +
      '<img class="ph" alt="" loading="lazy" tabindex="0" title="Click to enlarge" data-t="' + esc(styleLabel(r) + ' \u2013 ' + colorLabel(r)) + '" data-s="' + esc(r.sn) + '" data-style="' + esc(r.style) + '" data-c="' + esc(r.cn) + '" data-n="' + esc(r.color) + '">' +
      '<div class="item-info"><h2>' + esc(r.style) + '</h2>' +
      (r.sn && r.sn !== r.style ? '<div class="style-number">' + esc(r.sn) + '</div>' : '') +
      '<div class="item-color">' + esc(colorLabel(r)) + '</div>' +
      '<div class="item-meta"><span class="type-badge">' + esc(r.type || 'Carpet') + '</span>' +
      (!isTile && r.width ? '<span class="meta">' + esc(r.width) + '\u2032 wide</span>' : '') + '</div></div>' +
      '<div class="tot"><span class="meta">Total</span><b>' + fmt(g.total) + ' ' + unitForType(r.type) + '</b>' +
      (!isTile ? '<span class="meta">' + rollCount + (rollCount === 1 ? ' roll' : ' rolls') + '</span>' : '') + '</div></div>' +
      (isTile ? '' : '<details><summary>Show rolls</summary><table><thead><tr><th>Roll Number</th><th>Amt Avail (ft)</th></tr></thead><tbody>' +
      g.rolls.map(function(x){return '<tr><td>' + esc(x.roll) + '</td><td>' + fmt(x.avail) + '</td></tr>';}).join('') +
      '</tbody></table></details>') + '</section>';
  }).join('') + (list.length > shown ? '<p class="msg"><button id="more">Show more (' + (list.length - shown) + ' remaining)</button></p>' : '');
  var mb = document.getElementById('more');
  if (mb) mb.onclick = function(){ shown += PAGE_SIZE; render(); };
  Array.prototype.forEach.call(out.querySelectorAll('img.ph'), function(img){
    if (photoObserver) photoObserver.observe(img); else loadPhoto(img);
  });
}

function loadPhoto(img){
    var tries = photoCandidates({sn:img.dataset.s,style:img.dataset.style,cn:img.dataset.c,color:img.dataset.n});
    var i = 0;
    function noPhoto(){ var d = document.createElement('div'); d.className = 'ph'; d.textContent = 'No photo'; img.replaceWith(d); }
    if (!tries.length){ noPhoto(); return; }
    function next(){
      if (i >= tries.length){ noPhoto(); return; }
      var file = tries[i++];
      if (!file){ noPhoto(); return; }
      img.src = PHOTO_DIR + encodeURIComponent(file);
    }
    img.onerror = next; next();
}

function scheduleSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ shown = PAGE_SIZE; render(); }, 250);
}
document.getElementById('q').addEventListener('input', scheduleSearch);
document.getElementById('typ').addEventListener('change', function(){ refreshDependentFilters(true); shown = PAGE_SIZE; render(); });
['sty','wdt'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(){ refreshDependentFilters(false); shown = PAGE_SIZE; render(); }); });
document.getElementById('sort').addEventListener('change', function(){ shown = PAGE_SIZE; render(); });
document.getElementById('q').placeholder = 'Search style or color';

function fallback(){
  document.getElementById('out').innerHTML =
    '<p class="msg err">The inventory is unavailable right now. Please try again in a few minutes.</p>';
}


var lb = document.getElementById('lb'), lbImg = document.getElementById('lbimg'), lbCap = document.getElementById('lbcap'), lastFocus = null;
function openLb(img){ lbImg.src = img.currentSrc || img.src; lbCap.textContent = img.dataset.t || ''; lastFocus = img; lb.hidden = false; document.getElementById('lbx').focus(); }
function closeLb(){ lb.hidden = true; lbImg.removeAttribute('src'); if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function isPhoto(el){ return el && el.tagName === 'IMG' && el.classList.contains('ph'); }
var outEl = document.getElementById('out');
outEl.addEventListener('click', function(e){ if (isPhoto(e.target)) openLb(e.target); });
outEl.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && isPhoto(e.target)){ e.preventDefault(); openLb(e.target); } });
lb.addEventListener('click', closeLb);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !lb.hidden) closeLb(); });

fetch('inventory_date.txt?t=' + Date.now()).then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(t){
  var d = new Date(t.trim()), el = document.getElementById('asof');
  if (isNaN(d)) throw 0;
  el.textContent = 'Inventory as of: ' + d.toLocaleString(undefined, {
  year: 'numeric',
  month: 'short',
  day: 'numeric',
  hour: 'numeric',
  minute: '2-digit',
  timeZoneName: 'short'
});
}).catch(function(){
  var el = document.getElementById('asof'); el.textContent = 'Inventory date unavailable'; el.classList.add('warn');
});

fetch(PHOTO_MANIFEST).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(files){
  if (!Array.isArray(files)) throw 0;
  photoFiles = new Set(files);
}).catch(function(){ photoFiles = new Set(); photoManifestFailed = true; }).then(function(){
  if (photoManifestFailed){
    document.getElementById('out').innerHTML = '<p class="msg err">The photo list is unavailable, so inventory entries cannot be matched to photos. Please try again later.</p>';
    return;
  }
  return fetch(CSV_FILE, {cache:'no-cache'}).then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(load).catch(fallback);
});
</script>
</body>
</html>
